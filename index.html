<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小猪星球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D planet; quiet chrome pinned to the corners; a paper letter for the finale */
  --ink:#4b2537;
  --ink-soft:#8a5a70;
  --accent:#ff6f9c;
  --accent-deep:#d94a7c;
  --paper:#fffaf5;
  --glass:rgba(255,250,252,.86);
  --sky-a:#ffdbe8; --sky-b:#fdeee6; --sky-c:#d6eaff;
  --night-a:#1c1440; --night-b:#38215f; --night-c:#6e3f7e;
  --font-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-hand:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--sky-b);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky-a),var(--sky-b) 55%,var(--sky-c))}
#sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--night-a),var(--night-b) 55%,var(--night-c));opacity:0;transition:opacity 3s ease}
body.party #sky::after{opacity:1}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(18px,env(safe-area-inset-left,0px));pointer-events:none;transition:color 2s}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1;margin:0;letter-spacing:.06em}
.brand p{margin:8px 0 0;font-size:13px;letter-spacing:.12em;color:var(--ink-soft);transition:color 2s}
body.party .brand h1{color:#fff}
body.party .brand p{color:#f4cfe0}

.restart{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(18px,env(safe-area-inset-right,0px));width:44px;height:44px;border:0;border-radius:50%;background:var(--glass);color:var(--accent-deep);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 6px 24px rgba(120,40,80,.12);transition:transform .2s,background .2s}
.restart:hover{transform:rotate(-30deg)}
.restart svg{width:22px;height:22px}

.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock > *{pointer-events:auto}
.noses{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--glass);box-shadow:0 6px 24px rgba(120,40,80,.12)}
.nose{width:30px;height:24px;border-radius:50%;border:2px solid var(--accent);background:#fff;display:grid;grid-auto-flow:column;place-content:center;gap:5px;cursor:pointer;padding:0;transition:background .3s,transform .2s}
.nose::before,.nose::after{content:"";width:5px;height:8px;border-radius:50%;background:var(--accent)}
.nose.on{background:var(--accent)}
.nose.on::before,.nose.on::after{background:#fff}
.nose:hover{transform:translateY(-2px)}
.nose:focus-visible,.btn:focus-visible,.restart:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px}
.hint{font-size:13px;color:var(--ink-soft);letter-spacing:.06em;text-align:center;margin:0;transition:color 2s}
body.party .hint{color:#f4cfe0}
.btn{font-family:var(--font-display);font-size:18px;letter-spacing:.08em;border:0;border-radius:999px;padding:12px 26px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 8px 22px rgba(217,74,124,.35);transition:transform .2s,background .2s}
.btn:hover{background:var(--accent-deep);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--accent-deep);box-shadow:none;border:2px solid var(--accent);padding:8px 18px;font-size:15px}
#partyBtn{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 34px rgba(255,111,156,.75)}}

.card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:var(--paper);border-radius:24px;padding:20px 22px 18px;box-shadow:0 18px 50px rgba(90,30,60,.22);animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translate(-50%,24px);opacity:0}}
.card .eyebrow{font-size:12px;letter-spacing:.24em;color:var(--accent-deep);margin:0}
.card h2{font-family:var(--font-display);font-weight:400;font-size:30px;margin:6px 0 10px;letter-spacing:.04em;text-wrap:balance}
.card p.line{margin:0;font-size:15px;line-height:1.75;color:var(--ink)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.card .count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.letter-wrap{position:fixed;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:rgba(28,18,48,.45);animation:fade .6s ease}
@keyframes fade{from{opacity:0}}
.letter{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:6px;padding:34px 30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise2 .8s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise2{from{transform:translateY(40px) rotate(-2deg);opacity:0}}
.letter .to{font-family:var(--font-hand);font-size:28px;margin:0 0 6px;color:var(--accent-deep)}
.letter .body{font-family:var(--font-hand);font-size:22px;line-height:42px;white-space:pre-line;margin:0;color:var(--ink);background-image:repeating-linear-gradient(180deg,transparent 0 41px,#f3d3df 41px 42px)}
.letter .sign{font-family:var(--font-hand);font-size:22px;text-align:right;margin:14px 0 18px}
.letter .row{display:flex;justify-content:center}

@media (max-width:520px){
  .card h2{font-size:26px}
  .letter{padding:26px 20px 20px}
  .letter .body{font-size:20px;line-height:38px;background-image:repeating-linear-gradient(180deg,transparent 0 37px,#f3d3df 37px 38px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="scene" aria-label="小猪星球，可拖动旋转"></canvas>

<header class="brand">
  <h1>小猪星球</h1>
</header>

<button class="restart" id="restartBtn" title="重新开始" aria-label="重新开始">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
</button>

<div class="dock" id="dock">
  <div class="noses" id="noses" role="list" aria-label="拜访进度"></div>
  <p class="hint" id="hint">拖动转动星球 · 点一只小猪去拜访它</p>
  <button class="btn" id="partyBtn" hidden>点亮整颗星球</button>
</div>

<section class="card" id="card" hidden aria-live="polite">
  <p class="eyebrow" id="cRole">国王</p>
  <h2 id="cName">苗苗大王</h2>
  <p class="line" id="cLine"></p>
  <div class="foot">
    <span class="count" id="cCount">已拜访 1 / 8</span>
    <button class="btn ghost" id="cClose">继续逛逛</button>
  </div>
</section>

<div class="letter-wrap" id="letter" hidden>
  <article class="letter">
    <p class="to">全世界最好的甘源源：</p>
    <!-- 在这里改成你自己想说的话 -->
    <p class="body">生日快乐！

这颗星球上住满了小猪。
它们有的当国王，有的开飞机，有的做蛋糕，有的守着一整座图书馆，每一只都在做自己最喜欢的事。

我希望你也一样：
一直做喜欢的事，吃喜欢的食物，一直相信自己。
全宇宙的幸运都降临在小猪身边！</p>
    <p class="sign">—— 张朴</p>
    <div class="row"><button class="btn" id="letterClose">回到星球</button></div>
  </article>
</div>

<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
<script type="module">
import * as THREE from 'three';

/* ============ 可以改的文字 ============ */
const ROLES = [
  { role:'国王',       name:'苗苗大王', sign:'苗苗城堡',   lat: 22, lon:  0,
    line:'本王今日颁布政令：全星球每只小猪都要吃饱、睡好、开开心心。违令者，罚亲我一口。' },
  { role:'飞行员',     name:'喵喵机长', sign:'喵喵机场',   lat:-18, lon: 45,
    line:'我的飞机每天绕着星球飞好多好多圈，就为了在天上写一句话。抬头看看？' },
  { role:'厨师',       name:'圆滚主厨', sign:'猪猪餐厅',   lat: 24, lon: 90,
    line:'今日特供：小炒黄牛肉拌面，加两个煎鸡蛋。吃饱了才有力气过生日。' },
  { role:'医生',       name:'哼哼医生', sign:'哼哼诊所',   lat:-20, lon:135,
    line:'诊断结果：你只是太久没被抱抱了。处方：抱抱，一天三次，饭后服用。' },
  { role:'面包甜点师', name:'檬檬师傅', sign:'檬檬甜品屋', lat: 20, lon:180,
    line:'草莓蛋糕刚出炉！奶油要多多的，草莓要大大的。生日那天那一个，是最大最大的。' },
  { role:'科学家',     name:'泡泡博士', sign:'泡泡实验室', lat:-22, lon:225,
    line:'经过一千次实验，我终于证明了：开心是会传染的。这是本星球最重要的发现。' },
  { role:'建筑工人',   name:'依依师傅', sign:'依依工地',   lat: 22, lon:270,
    line:'这栋楼盖好以后，会是全星球最高的房子。顶楼那间，留给你住。' },
  { role:'图书馆管理员', name:'缘缘', sign:'缘缘图书馆', lat:-18, lon:315,
    line:'这里收着星球上所有的故事。最厚的那本叫《甘源源》，还在一页一页往下写呢。' },
];
const BANNER_TEXT = '小猪统治宇宙';
/* ===================================== */

const R = 8, D2R = Math.PI/180, UP = new THREE.Vector3(0,1,0);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed = 20260405 % 2147483647; const rand = () => (seed = seed * 16807 % 2147483647) / 2147483647;

/* ---------- renderer / camera ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 10, 70);

const TAN = Math.tan(camera.fov/2*D2R);
const dists = () => {
  const a = Math.min(camera.aspect, 1);
  return { overview: 9.6/(TAN*a), focus: Math.max(9.5, 2.6/(TAN*a)), party: Math.max(10, 3.3/(TAN*a)) };
};

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight('#fff4f8', '#b9a6dc', 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0e2', 2.1);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-13, right:13, top:13, bottom:-13, near:1, far:90 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const SUN_DAY = new THREE.Color('#fff0e2'), SUN_NIGHT = new THREE.Color('#b8a4ff');

/* ---------- material helpers ---------- */
const gradientMap = new THREE.DataTexture(new Uint8Array([110, 185, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter; gradientMap.needsUpdate = true;
const mats = new Map();
const mat = (color, extra) => {
  const k = color + (extra ? JSON.stringify(extra) : '');
  if (!mats.has(k)) mats.set(k, new THREE.MeshToonMaterial({ color, gradientMap, ...extra }));
  return mats.get(k);
};
const M = (geo, c, extra) => { const m = new THREE.Mesh(geo, c instanceof THREE.Material ? c : mat(c, extra)); m.castShadow = true; m.receiveShadow = true; return m; };
const put = (parent, o, x=0, y=0, z=0) => { o.position.set(x, y, z); parent.add(o); return o; };
const sph = (r, w=16, h=12) => new THREE.SphereGeometry(r, w, h);
const cyl = (a, b, h, s=16) => new THREE.CylinderGeometry(a, b, h, s);
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const cone = (r, h, s=16) => new THREE.ConeGeometry(r, h, s);
const DS = { side: THREE.DoubleSide };
const windowMat = new THREE.MeshToonMaterial({ color:'#fff3c4', gradientMap, emissive:'#ffb347', emissiveIntensity:0 });
const bulbs = [];

/* ---------- canvas text (signs, banner) ---------- */
const redraws = [];
function textPlane(text, w, h, bg, fg, opts = {}) {
  const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512*h/w);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const draw = () => {
    const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
    const r = c.height*0.28;
    x.fillStyle = bg; x.beginPath(); x.roundRect(4, 4, c.width-8, c.height-8, r); x.fill();
    if (opts.border) { x.lineWidth = 6; x.strokeStyle = opts.border; x.stroke(); }
    let fs = c.height*0.6; x.font = `${fs}px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif`;
    while (x.measureText(text).width > c.width*0.86 && fs > 10) { fs -= 2; x.font = `${fs}px "ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif`; }
    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, c.width/2, c.height/2 + fs*0.04);
    tex.needsUpdate = true;
  };
  draw(); redraws.push(draw);
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
}
document.fonts?.load('40px "ZCOOL KuaiLe"').then(() => redraws.forEach(f => f())).catch(() => {});

/* ---------- placement ---------- */
const dirLL = (lat, lon) => { const a = lat*D2R, o = lon*D2R; return new THREE.Vector3(Math.cos(a)*Math.sin(o), Math.sin(a), Math.cos(a)*Math.cos(o)); };
function orient(obj, dir, fwdHint) {
  let f = fwdHint.clone().sub(dir.clone().multiplyScalar(fwdHint.dot(dir)));
  if (f.lengthSq() < 1e-6) f = new THREE.Vector3(1, 0, 0).sub(dir.clone().multiplyScalar(dir.x));
  f.normalize();
  const x = new THREE.Vector3().crossVectors(dir, f);
  obj.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, dir, f));
}
const world = new THREE.Group(); scene.add(world);
function plant(obj, dir, h = -0.04, fwd) {
  obj.position.copy(dir).multiplyScalar(R + h);
  orient(obj, dir, fwd || new THREE.Vector3(rand()-.5, rand()-.5, rand()-.5));
  world.add(obj); return obj;
}

/* ---------- planet ---------- */
const noise = (x, y, z) => Math.sin(x*.55+1.7)*Math.sin(y*.63+.3)*Math.sin(z*.51+2.2) + .5*Math.sin(x*1.3+y*.9)*Math.sin(z*1.1-.7);
const planetGeo = new THREE.IcosahedronGeometry(R, 14);
{
  const pos = planetGeo.attributes.position, v = new THREE.Vector3();
  const smooth = (a, b, t) => { t = Math.min(1, Math.max(0, (t-a)/(b-a))); return t*t*(3-2*t); };
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const d = noise(v.x*R, v.y*R, v.z*R) * 0.16 * (1 - smooth(.9, .95, v.y));
    v.multiplyScalar(R + d); pos.setXYZ(i, v.x, v.y, v.z);
  }
  const cols = new Float32Array(pos.count*3), c = new THREE.Color(), a = new THREE.Vector3(), b = new THREE.Vector3();
  const greens = ['#a9e4a0', '#97d996', '#b8ecaa', '#8fd29a', '#c3efb0'];
  for (let i = 0; i < pos.count; i += 3) {
    v.fromBufferAttribute(pos, i); a.fromBufferAttribute(pos, i+1); b.fromBufferAttribute(pos, i+2);
    v.add(a).add(b).normalize();
    const n = noise(v.x*14, v.y*14+3, v.z*14), n2 = noise(v.z*22+1, v.x*22, v.y*22-2);
    let hex = greens[Math.floor((n*.5+.5)*4.999) % 5];
    if (n2 > .95) hex = '#ffd9e6';
    if (v.y > .93) hex = '#d8f2cc';
    c.set(hex);
    for (let k = 0; k < 3; k++) { cols[(i+k)*3] = c.r; cols[(i+k)*3+1] = c.g; cols[(i+k)*3+2] = c.b; }
  }
  planetGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  planetGeo.computeVertexNormals();
}
const planet = new THREE.Mesh(planetGeo, new THREE.MeshToonMaterial({ vertexColors: true, gradientMap }));
planet.receiveShadow = true; world.add(planet);

/* ---------- pig ---------- */
function makePig(o = {}) {
  const body = o.body || '#f9b4c4', deep = o.deep || '#ee92a9', snoutC = o.snout || '#f497ae';
  const g = new THREE.Group();
  put(g, M(sph(.55, 22, 16), body), 0, .72, 0).scale.set(1, .92, 1.05);
  put(g, M(sph(.5, 24, 18), body), 0, 1.42, .12);
  put(g, M(cyl(.19, .21, .14, 20), snoutC), 0, 1.34, .6).rotation.x = Math.PI/2;
  for (const s of [-1, 1]) {
    put(g, M(sph(.042, 8, 6), '#b04e6c'), s*.075, 1.34, .672).scale.set(1, 1.4, .5);
    put(g, M(sph(.068, 12, 10), '#2a1a22'), s*.18, 1.53, .55);
    put(g, M(sph(.024, 8, 6), '#ffffff'), s*.18 + .025, 1.56, .61);
    put(g, M(sph(.09, 12, 8), '#ff8fab'), s*.31, 1.33, .48).scale.set(1, .6, .35);
    put(g, M(cone(.15, .3, 14), body), s*.29, 1.86, .04).rotation.set(.25, 0, -s*.45);
    for (const z of [.22, -.22]) put(g, M(cyl(.11, .12, .3, 12), deep), s*.24, .15, z);
    const arm = put(g, new THREE.Group(), s*.5, .95, .12);
    put(arm, M(sph(.13, 12, 10), body), s*.04, -.1, .05);
    g.userData[s < 0 ? 'armL' : 'armR'] = arm;
  }
  put(g, M(new THREE.TorusGeometry(.09, .03, 6, 14, Math.PI*1.7), deep), 0, .82, -.6).rotation.y = Math.PI/2;
  return g;
}
const capOn = (p, color, frac = .42, r = .53) => put(p, M(new THREE.SphereGeometry(r, 22, 12, 0, Math.PI*2, 0, Math.PI*frac), color, DS), 0, 1.42, .12);
const coatOn = (p, color) => { const c = put(p, M(new THREE.SphereGeometry(.575, 22, 16, 0, Math.PI*2, Math.PI*.36, Math.PI*.64), color), 0, .72, 0); c.scale.set(1, .92, 1.05); return c; };
function glassesOn(p, color) {
  for (const s of [-1, 1]) put(p, M(new THREE.TorusGeometry(.1, .018, 6, 18), color), s*.18, 1.53, .6);
  put(p, M(box(.12, .02, .02), color), 0, 1.55, .63);
}
function heart(color, s = 1) {
  const g = new THREE.Group();
  for (const x of [-1, 1]) put(g, M(sph(.1*s, 14, 10), color), x*.07*s, .04*s, 0);
  put(g, M(cone(.155*s, .2*s, 16), color), 0, -.1*s, 0).rotation.x = Math.PI;
  return g;
}
function partyHat(p, color) {
  const h = put(p, new THREE.Group(), -.1, 1.88, .1); h.rotation.z = .25;
  put(h, M(cone(.17, .42, 16), color), 0, .2, 0);
  put(h, M(sph(.07, 10, 8), '#ffffff'), 0, .43, 0);
}

/* ---------- buildings ---------- */
function house(w, h, d, wall, roof, rh = .8) {
  const g = new THREE.Group();
  put(g, M(box(w, h, d), wall), 0, h/2, 0);
  const rg = cone(.7071, rh, 4); rg.rotateY(Math.PI/4);

    cakeLight.intensity = 2.5*g + Math.sin(t*17)*.2*g;
    plaza.userData.balloons.forEach((b, i) => { b.rotation.z = Math.sin(t*1.2 + i)*.06; b.rotation.x = Math.cos(t*1.1 + i)*.05; });
    plaza.userData.guests.forEach(p => { p.position.y = .05 + Math.abs(Math.sin(t*4 + p.userData.guestPhase))*.12; });
    const yy = plaza.userData.yy; yy.position.y = .05 + Math.abs(Math.sin(t*3))*.1;
    yy.userData.armL.rotation.z = Math.sin(t*6)*.3; yy.userData.armR.rotation.z = -Math.sin(t*6)*.3;
    if (partyT > letterAt) { letterAt = Infinity; $('letter').hidden = false; }
    fwTimer -= dt;
    if (partyT > 1.5 && partyT < (reduce ? 3 : 16) && fwTimer <= 0) {
      fwTimer = .35 + rand()*.35;
      const d = new THREE.Vector3(rand()*2-1, rand()*.8 + .4, rand()*2-1).normalize();
      d.lerp(camera.position.clone().normalize(), .35).normalize();
      burst(d.multiplyScalar(R + 5 + rand()*4), FW[Math.floor(rand()*FW.length)]);
    }
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.age += dt; const pa = b.pts.geometry.attributes.position;
    for (let j = 0; j < b.vel.length; j++) {
      const v = b.vel[j]; v.multiplyScalar(.965);
      tmp.fromBufferAttribute(pa, j); v.addScaledVector(tmp.clone().normalize(), -1.2*dt);
      pa.setXYZ(j, tmp.x + v.x*dt, tmp.y + v.y*dt, tmp.z + v.z*dt);
    }
    pa.needsUpdate = true; b.pts.material.opacity = 1 - b.age/b.life;
    if (b.age > b.life) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

if (location.hash === '#party') ROLES.forEach((_, i) => visited.add(i));
refreshUI();
world.quaternion.copy(faceQuat(stations[0].group, .42, .91));
camera.position.set(0, 4, 70); camera.lookAt(camTarget);
flyTo(null, new THREE.Vector3(0, 0, dists().overview), new THREE.Vector3(), 2.6, true);
lastInteract = 2;
loop();
</script>
